# Project overrides; omitted fields inherit user settings.
schema_version: 1
model_selection:
  profile: balanced
  allow_cross_host: false
  allow_unverified_models: false
  catalog_cache_ttl_hours: 24
  on_model_unavailable: pause
  on_catalog_change: recommend_only
hosts:
  codex:
    enabled: true
    roles:
      coordinator:
        model: gpt-6-astra
        effort: xhigh
      requirements:
        model: gpt-6-astra
        effort: xhigh
      planner:
        model: gpt-6-astra
        effort: xhigh
      coder:
        model: gpt-6.1-sol
        effort: medium
      tester:
        model: gpt-6-astra
        effort: xhigh
      reviewer:
        model: gpt-6-astra
        effort: xhigh
      repair:
        model: gpt-6.1-sol
        effort: medium
      final_auditor:
        model: gpt-6-astra
        effort: xhigh
  claude:
    enabled: true
    roles:
      coordinator:
        model: claude-opus-5-5
        effort: high
      requirements:
        model: claude-opus-5-5
        effort: high
      planner:
        model: claude-opus-5-5
        effort: high
      coder:
        model: claude-sonnet-5-5
        effort: auto
      tester:
        model: claude-opus-5-5
        effort: high
      reviewer:
        model: claude-opus-5-5
        effort: high
      repair:
        model: claude-sonnet-5-5
        effort: auto
      final_auditor:
        model: claude-opus-5-5
        effort: high
execution:
  mode: interactive_native
  max_parallel_workers: 4
  max_parallel_test_jobs: 1
  max_task_attempts: 3
  max_review_rounds: 3
  max_repeated_finding_rounds: 2
  task_timeout_minutes: 30
  run_timeout_minutes: 180
  on_host_disconnect: pause_and_preserve
planning:
  require_approval: true
  preserve_user_overrides: true
git:
  target_branch: null
  integration_prefix: orch
  merge_strategy: merge_no_ff
  commit_policy: atomic_unit
  finalization: approval_required
  remote_push: false
  dirty_checkout_policy: stop
review:
  required: true
  block_on:
    - critical
    - high
  independent_session: true
  final_audit: true
  unresolved_nonblocking: report
quality:
  baseline_required: true
  commands:
    - id: skills-test
      executable: node
      args:
        - --test
        - tests/unit/skills.test.ts
      cwd: .
      stages:
        - baseline
        - task
        - integration
        - final
      required: true
      timeout_seconds: 300
  allow_missing_tests: false
cleanup:
  on_success: owned_merged_clean_only
  on_failure: preserve
  keep_reports: true
  keep_integration_until_finalized: true
observability:
  telemetry: off
  store_raw_prompts: false
  redact_secrets: true
